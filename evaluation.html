<script>
const SUPABASE_URL='https://nrweporylfaorlqektsk.supabase.co';
const SUPABASE_ANON='sb_publishable_a3X1ltKqAaTv6CyxHIReug_xEPqqCSS';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
/* 評価項目：「評価項目を見る」（閲覧のみ・今期使う項目だけ）は全員。「評価項目を編集」は代表・管理者のみ */
const ADMIN_ROLES=['代表','管理者'];
/* ===== 評価点の公開範囲 =====
   POINT_ALL_ROLES の役職 … 全員分の評価点を見られる
   それ以外（スタイリスト以下）… 自分の分だけ見られる（一覧にも自分だけ表示）
   全スタッフに全員分を見せるときは STAFF_SEE_ALL を true に変更 */
const POINT_ALL_ROLES=['代表','管理者','マネージャー','店長','チーフ'];
const STAFF_SEE_ALL=false;
/* 給与制度の金額・条件を編集できる役職 */
const PAY_EDIT_ROLES=['代表'];
const MONTH_LABELS=['1月','2月','3月'];
const QUARTER_MONTHS={1:[1,2,3],2:[4,5,6],3:[7,8,9],4:[10,11,12]};
const EVAL_TARGET_ROLES=['店長','チーフ','スタイリスト','Jrスタイリスト','カラーリスト','アシスタント','レセプション'];
const POS_ORDER=['店長','チーフ','スタイリスト','Jrスタイリスト','カラーリスト','アシスタント','レセプション'];
const DATA_SOURCES=[
  ['manual','手入力（目標・結果を入力）'],
  ['store_sales','店舗全体の総売（数値管理・税込）'],
  ['total_sales','個人の総売（指名＋フリー＋店販・税込）'],
  ['meimei_sales','指名技術売上（税込）'],
  ['tanden','店販売上（税込）'],
  ['meimei_clients','指名入客数'],
  ['store_clients','所属店舗の総入客数'],
  ['late_count','遅刻数（3か月合計・0回で60点、1回ごとに−10点）'],
  ['sub_avg','部下の評価点の平均（同じ店舗のチーフ以下・自動）']
];
/* 「部下の評価点の平均」で部下として数える役職（チーフ以下。店長は含めない） */
const SUB_ROLES=['チーフ','スタイリスト','Jrスタイリスト','カラーリスト','アシスタント','レセプション'];

let assignHistory=[];
let students=[],ME=null,allCriteria=[],currentCriteria=[],entries={},currentStore='all',currentSid=null,currentDetailSt=null,currentDetailYear=null,currentSalesMap={};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function storeLabel(v){return v==='エルズ'?'ailes':v;}
function storeShortCode(storeJP){return storeJP==='エルズ'?'ailes':'soleil';}
function fmtNum(n){return Number(n||0).toLocaleString();}
function taxIncl(x){return Math.floor(Number(x||0)*11/10);}
function canSeeAll(){return !!ME&&(STAFF_SEE_ALL||POINT_ALL_ROLES.includes(ME.position));}
function canSeePoints(st){return !!ME&&(canSeeAll()||(!!st&&st.id===ME.id));}
/* 異動履歴を見て「その月の所属店舗」を返す（履歴がなければ現在の店舗） */
function storeAt(s,year,m){
  const v=valueAsOf(assignHistory,s.id,'store',year+'-'+String(m).padStart(2,'0')+'-01');
  return v||s.store;
}
/* 四半期の所属店舗＝その期でまだ来ていない月を除いた最後の月の店舗 */
function quarterStore(s,year,months){
  let m=months[0];
  months.forEach(function(x){if(!isFutureMonth(year,x))m=x;});
  return storeAt(s,year,m);
}
function isFutureMonth(year,m){
  const now=new Date();
  const ny=now.getFullYear(),nm=now.getMonth()+1;
  return year>ny||(year===ny&&m>nm);
}

/* ===== 画面切り替え（評価一覧／給与制度） ===== */
function showView(v){
  document.getElementById('eval-view').style.display=(v==='eval')?'':'none';
  document.getElementById('pay-view').style.display=(v==='pay')?'':'none';
  document.getElementById('vtab-eval').classList.toggle('active',v==='eval');
  document.getElementById('vtab-pay').classList.toggle('active',v==='pay');
}

/* ===== 給与制度ページ（全員閲覧可・編集は PAY_EDIT_ROLES のみ） =====
   下の数字は初期値。代表が画面から保存すると payroll_settings テーブルの内容が優先される */
/* 指名売上 → 手当。c: o=オレンジ r=赤 b=青 */
let PAY_MEIMEI=[
  [200000,10000,'o'],[300000,20000,''],[500000,30000,''],[600000,40000,''],[700000,50000,''],
  [800000,70000,'r'],[900000,80000,''],[1000000,100000,'b'],[1100000,120000,''],[1200000,140000,''],
  [1300000,160000,''],[1400000,180000,''],[1500000,200000,'r'],[1600000,220000,''],[1700000,240000,''],
  [1800000,260000,''],[1900000,280000,''],[2000000,300000,''],[2100000,320000,''],[2200000,340000,''],
  [2300000,360000,''],[2400000,380000,''],[2500000,400000,''],[2600000,430000,''],[2700000,460000,''],
  [2800000,490000,''],[2900000,520000,''],[3000000,550000,'']
];

let payEditing=false,payDraft=null,payMeta='';
function canEditPay(){return !!ME&&PAY_EDIT_ROLES.includes(ME.position);}
function payCurrent(){
  return {meimei:PAY_MEIMEI,meimei_notes:PAY_MEIMEI_NOTES,role:PAY_ROLE,promo:PAY_PROMO,fee:PAY_FEE,bonus:PAY_BONUS,base:PAY_BASE};
}
function applyPay(d){
  if(!d)return;
  if(Array.isArray(d.meimei))PAY_MEIMEI=d.meimei;
  if(Array.isArray(d.meimei_notes))PAY_MEIMEI_NOTES=d.meimei_notes;
  if(Array.isArray(d.role))PAY_ROLE=d.role;
  if(Array.isArray(d.promo))PAY_PROMO=d.promo;
  if(Array.isArray(d.fee))PAY_FEE=d.fee;
  if(Array.isArray(d.bonus))PAY_BONUS=d.bonus;
  if(Array.isArray(d.base))PAY_BASE=d.base;
}
async function loadPayroll(){
  const {data,error}=await sb.from('payroll_settings').select('*').eq('id','main').maybeSingle();
  if(error||!data)return;
  applyPay(data.data);
  if(data.updated_at){
    const d=new Date(data.updated_at);
    payMeta=d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+(data.updated_by?'（'+data.updated_by+'）':'');
  }
}
function startPayEdit(){
  if(!canEditPay())return;
  payDraft=JSON.parse(JSON.stringify(payCurrent()));
  payEditing=true;
  renderPayroll();
}
function cancelPayEdit(){payEditing=false;payDraft=null;renderPayroll();}
function payInp(key,r,c,val,type,width){
  return '<input class="inp" type="'+(type==='num'?'number':'text')+'" style="width:'+(width||'100%')+';padding:6px 8px;font-size:13px" value="'+esc(val==null?'':val)+'" data-k="'+key+'" data-r="'+r+'" data-c="'+c+'" data-t="'+type+'" onchange="updPay(this)">';
}
function updPay(el){
  const k=el.dataset.k,r=Number(el.dataset.r),c=el.dataset.c,t=el.dataset.t;
  const v=t==='num'?(el.value===''?0:Number(el.value)):el.value;
  if(c==='')payDraft[k][r]=v; else payDraft[k][r][Number(c)]=v;
}
function addPayRow(k){
  if(k==='meimei'){const last=payDraft.meimei[payDraft.meimei.length-1]||[0,0,''];payDraft.meimei.push([Number(last[0])+100000,Number(last[1]),'']);}
  if(k==='meimei_notes')payDraft.meimei_notes.push('');
  renderPayEditor();
}

async function savePay(){
  if(!canEditPay())return;
  const {error}=await sb.from('payroll_settings').upsert({id:'main',data:payDraft,updated_at:new Date().toISOString(),updated_by:ME.name||''},{onConflict:'id'});

/* ===== 店舗単位の集計（数値管理と同じ計算。売上は税込） ===== */
let storeCache={};
function getStoreMonth(storeJP,year,month){
  const monthStr=year+'-'+String(month).padStart(2,'0');
  const key=storeJP+'_'+monthStr;
  if(!storeCache[key])storeCache[key]=computeStoreMonth(storeJP,monthStr);
  return storeCache[key];
}
async function computeStoreMonth(storeJP,monthStr){
  const {data:allStudents}=await sb.from('students').select('id,position,store').eq('is_active',true);
  const y=Number(monthStr.slice(0,4)),mo=Number(monthStr.slice(5,7));
  const staffList=(allStudents||[]).filter(function(s){return (s.store==='両店'||storeAt(s,y,mo)===storeJP)&&s.position!=='管理者';});
  const staffIds=staffList.map(function(s){return s.id;});
  const {data:allocData}=await sb.from('sales_allocation').select('*').eq('month',monthStr).maybeSingle();
  const alloc=allocData||{ailes_pct:50,soleil_pct:50};
  const {data:prodData}=await sb.from('role_productivity').select('*').lte('month',monthStr).order('month',{ascending:false});
  const roleMap={};
  (prodData||[]).forEach(function(r){if(!(r.position in roleMap))roleMap[r.position]=Number(r.monthly_target)||0;});
  let salesRows=[];
  if(staffIds.length){
    const {data}=await sb.from('sales_data').select('*').in('student_id',staffIds).eq('month',monthStr);
    salesRows=data||[];
  }
  const shortCode=storeShortCode(storeJP);
  let target=0,resultExcl=0,clients=0,hasData=false;
  staffList.forEach(function(s){
    const isRyoten=s.store==='両店';
    const pct=isRyoten?((storeJP==='エルズ'?(alloc.ailes_pct||50):(alloc.soleil_pct||50))/100):1;
    target+=Math.round((roleMap[s.position]||0)*pct);
    let row;
    if(isRyoten)row=salesRows.find(function(r){return r.student_id===s.id&&r.store===shortCode;});
    else row=salesRows.find(function(r){return r.student_id===s.id&&!r.store;});
    if(rowHasData(row))hasData=true;
    if(row){
      resultExcl+=Number(row.meimei_sales||0)+Number(row.free_sales||0)+Number(row.tanden||0);
      clients+=Number(row.meimei_clients||0)+Number(row.free_clients||0);
    }
  });
  return {target:Math.floor(target),result:taxIncl(resultExcl),clients:clients,hasData:hasData};
}

async function loadSalesMap(ids,year,months){
  const map={};
  if(!ids.length)return map;
  const ms=months.map(function(m){return year+'-'+String(m).padStart(2,'0');});
  const {data}=await sb.from('sales_data').select('*').in('student_id',ids).in('month',ms);
  (data||[]).forEach(function(r){const k=r.student_id+'_'+r.month;(map[k]=map[k]||[]).push(r);});
  return map;
}
function rowHasData(row){
  return !!row&&(row.meimei_sales!=null||row.free_sales!=null||row.tanden!=null||row.meimei_clients!=null||row.free_clients!=null);
}
function getRowFrom(map,sid,year,m){
  const arr=map[sid+'_'+year+'-'+String(m).padStart(2,'0')]||[];
  return arr.find(function(r){return !r.store;})||null;
}

  document.querySelectorAll('.store-tab').forEach(function(t){t.classList.remove('active');});
  document.getElementById(store==='all'?'tab-all':(store==='エルズ'?'tab-ailes':'tab-soleil')).classList.add('active');

function sortedTargetStudents(){
  let list=students.filter(function(s){return EVAL_TARGET_ROLES.includes(s.position);});
  if(!canSeeAll())return list.filter(function(s){return ME&&s.id===ME.id;});
  const yy=Number(document.getElementById('ev-year').value);
  const mm=QUARTER_MONTHS[Number(document.getElementById('ev-quarter').value)];
  if(currentStore!=='all')list=list.filter(function(s){return s.store==='両店'||quarterStore(s,yy,mm)===currentStore;});
  const posF=document.getElementById('ev-pos-filter').value;
  if(posF)list=list.filter(function(s){return s.position===posF;});
  list.sort(function(a,b){
    const ai=POS_ORDER.indexOf(a.position||'');
    const bi=POS_ORDER.indexOf(b.position||'');
    return (ai===-1?999:ai)-(bi===-1?999:bi);
  });
  return list;
}

function scoreForRate(rate,scaleJson){
  const scale=(scaleJson||[]).slice().sort(function(a,b){return a[0]-b[0];});
  let pts=0;
  for(const pair of scale){if(rate>=pair[0])pts=pair[1];}
  return pts;
}

let subAvgCache={};
function getSubordinateAvg(storeJP,year,months){
  const key=storeJP+'_'+year+'_'+months.join('-');
  if(!subAvgCache[key])subAvgCache[key]=computeSubordinateAvg(storeJP,year,months);
  return subAvgCache[key];
}
async function computeSubordinateAvg(storeJP,year,months){
  const subs=students.filter(function(s){return SUB_ROLES.includes(s.position)&&quarterStore(s,year,months)===storeJP;});
  const ids=subs.map(function(s){return s.id;});
  const list=[];
  if(!ids.length)return {avg:0,list:list,count:0};
  const {data}=await sb.from('eval_entries').select('*').in('student_id',ids).eq('year',year).in('month',months);
  const em={};
  (data||[]).forEach(function(r){em[r.student_id+'_'+r.criteria_id+'_'+r.month]=r;});
  const salesMap=await loadSalesMap(ids,year,months);
  for(const s of subs){
    /* 部下側に同じ項目があっても無限ループしないよう sub_avg は除外 */
    const crit=allCriteria.filter(function(c){return c.position===s.position&&c.data_source!=='sub_avg';});
    if(!crit.length){list.push({s:s,total:null,reason:'評価項目なし'});continue;}
    const ctx={
      getEntry:function(cid,m){return em[s.id+'_'+cid+'_'+m];},
      getRow:function(sid,m){return getRowFrom(salesMap,sid,year,m);}
    };
    let total=0;
    for(const c of crit){const r=await evalCriterion(c,s,year,months,ctx);total+=r.weighted;}
    /* 合計0点＝まだデータが入っていない人として平均から外す */
    if(total<=0){list.push({s:s,total:null,reason:'データなし'});continue;}
    list.push({s:s,total:Math.round(total*10)/10});
  }
  const valid=list.filter(function(x){return x.total!=null;});
  const avg=valid.length?valid.reduce(function(a,x){return a+x.total;},0)/valid.length:0;
  return {avg:Math.round(avg*10)/10,list:list,count:valid.length};
}

/* ===== 1項目ぶんの計算（一覧・詳細で共通） ===== */
function monthColHtml(m,tgtText,valText,hit,future,label){
  if(future)return '<div class="month-col" style="opacity:.45"><div class="month-col-label">'+m+'月</div><div class="month-col-target">'+(label||'—')+'</div><div class="month-col-result">—</div></div>';
  return '<div class="month-col'+(hit?' hit':'')+'"><div class="month-col-label">'+m+'月</div><div class="month-col-target">'+tgtText+'</div><div class="month-col-result">'+valText+'</div></div>';
}

async function evalCriterion(c,st,year,months,ctx){
  const w=Number(c.weight||0);
  const src=c.data_source||'manual';
  const res={c:c,w:w,src:src,html:'',targetSum:0,resultSum:0,rate:0,score:0,weighted:0,note:'',noBase:false,auto:src!=='manual'};

  if(src==='manual'){
    let t=0,r=0,has=false;
    months.forEach(function(m){
      if(c.calc_type==='inverse_count'&&isFutureMonth(year,m))return;
      const e=ctx.getEntry(c.id,m);
      if(e&&e.target!=null){has=true;t+=Number(e.target||0);}
      r+=Number(e&&e.result||0);
    });
    res.targetSum=t;res.resultSum=r;
    if(c.calc_type==='inverse_count'){res.rate=has?Math.max(0,1-(r/(t||1))):0;}
    else{res.rate=t>0?(r/t):0;}
    res.score=scoreForRate(res.rate,c.scale_json);
    res.weighted=res.score*w;
    return res;
  }

  const cols=[];
  if(src==='sub_avg'){
    const d=await getSubordinateAvg(quarterStore(st,year,months),year,months);
    res.score=d.avg;
    res.resultSum=d.count;
    res.weighted=res.score*w;
    if(!d.count){res.note='対象の部下の評価データがありません';res.html='<div class="month-col"><div class="month-col-result">対象なし</div></div>';return res;}
    const show=canSeeAll();
    d.list.forEach(function(x){
      cols.push('<div class="month-col"><div class="month-col-label">'+esc(x.s.name)+'</div><div class="month-col-target">'+esc(x.s.position)+'</div><div class="month-col-result">'+(x.total==null?esc(x.reason):(show?x.total+'点':'対象'))+'</div></div>');
    });
    cols.push('<div class="total-col"><div class="total-col-label">平均</div><div class="total-col-nums">'+d.count+'名</div><div class="total-col-rate">'+(show?d.avg+'点':'—')+'</div></div>');
    res.html=cols.join('');
    return res;
  }
  if(src==='late_count'){
    let sum=0,has=false;
    months.forEach(function(m){
      if(isFutureMonth(year,m)){cols.push(monthColHtml(m,'','',false,true));return;}
      const row=ctx.getRow(st.id,m);
      const v=(row&&row.late!=null)?Number(row.late):null;
      if(v!=null){has=true;sum+=v;}
      cols.push(monthColHtml(m,'遅刻',v==null?'未入力':v+'回',false,false));
    });
    res.resultSum=sum;
    res.score=has?Math.max(0,60-10*sum):0;
    res.note=has?'':'遅刻数が未入力です';
    res.weighted=res.score*w;
    cols.push('<div class="total-col"><div class="total-col-label">合計</div><div class="total-col-nums">'+sum+'回</div><div class="total-col-rate">'+(has?'−10点/回':'未入力')+'</div></div>');
    res.html=cols.join('');
    return res;
  }

  const isMoney=(src==='total_sales'||src==='meimei_sales'||src==='tanden'||src==='store_sales');
  const base=(c.base_value!=null&&c.base_value!=='')?Number(c.base_value):null;
  const hasBase=(src==='store_sales')||base!=null;
  let tSum=0,rSum=0;
  for(const m of months){
    if(isFutureMonth(year,m)){cols.push(monthColHtml(m,'','',false,true));continue;}
    let tgt=(src==='store_sales')?null:base,val=0;
    if(src==='store_sales'||src==='store_clients'){
      const d=await getStoreMonth(storeAt(st,year,m),year,m);
      if(!d.hasData){cols.push(monthColHtml(m,'未入力','',false,true,'未入力'));continue;}
      if(src==='store_sales'){tgt=d.target;val=d.result;}
      else{val=d.clients;}
    } else {
      const row=ctx.getRow(st.id,m);
      if(!rowHasData(row)){cols.push(monthColHtml(m,'','',false,true,'未入力'));continue;}
      if(src==='total_sales')val=taxIncl(Number(row.meimei_sales||0)+Number(row.free_sales||0)+Number(row.tanden||0));
      else if(src==='meimei_sales')val=taxIncl(row.meimei_sales);
      else if(src==='tanden')val=taxIncl(row.tanden);
      else if(src==='meimei_clients')val=Number(row.meimei_clients||0);
    }
    if(tgt!=null)tSum+=tgt;
    rSum+=val;
    const hit=tgt!=null&&tgt>0&&val>=tgt;
    cols.push(monthColHtml(m,tgt!=null?'目標 '+fmtNum(tgt):'基準なし',fmtNum(val),hit,false));
  }
  res.targetSum=tSum;res.resultSum=rSum;res.noBase=!hasBase;
  if(hasBase){
    res.rate=tSum>0?(rSum/tSum):0;
    res.score=scoreForRate(res.rate,c.scale_json);
  } else {
    res.note='基準値が未設定です（実績のみ表示）';
  }
  res.weighted=res.score*w;
  cols.push('<div class="total-col"><div class="total-col-label">合計</div><div class="total-col-nums">'+(hasBase?fmtNum(tSum)+'→':'')+fmtNum(rSum)+'</div><div class="total-col-rate">'+(hasBase?Math.round(res.rate*100)+'%':'基準未設定')+'</div></div>');
  res.html=cols.join('');
  return res;
}

function scoreText(res,showPts){
  if(showPts)return res.score+'点';
  if(res.src==='late_count')return res.resultSum+'回';
  if(res.src==='sub_avg')return '—';
  if(res.src!=='manual'&&res.noBase)return '—';
  if(res.c.calc_type==='inverse_count')return '—';
  return Math.round(res.rate*100)+'%';
}

      return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;'+(isBase?'background:#fdf3df;border-radius:6px;padding:3px 4px':'')+'">'
        +'<div style="width:82px;font-size:12px;color:'+(isBase?'var(--accent)':'var(--mid)')+';text-align:right;font-weight:'+(isBase?'700':'400')+';white-space:nowrap">'+score+'点'+(isBase?'（基準）':'')+'</div>'
        +'<input class="inp" type="number" step="0.1" style="width:90px" data-i="'+i+'" data-score="'+score+'" data-f="scale_pct" value="'+pct+'" placeholder="%" onchange="updScalePct(this)">'
        +'<span style="font-size:12px;color:var(--soft)">％達成で</span>'
        +'</div>';
    }).join('');
    const weightOptsHtml=WEIGHT_OPTIONS.map(function(w){
      return '<option value="'+w+'"'+(Number(it.weight)===w?' selected':'')+'>'+Math.round(w*100)+'%</option>';
    }).join('');
    const srcOptsHtml=DATA_SOURCES.map(function(d){
      return '<option value="'+d[0]+'"'+((it.data_source||'manual')===d[0]?' selected':'')+'>'+esc(d[1])+'</option>';
    }).join('');
    return '<div class="admin-item">'
      +'<label style="position:absolute;top:8px;right:36px;font-size:11px;color:var(--mid);display:flex;align-items:center;gap:4px"><input type="checkbox" data-i="'+i+'" data-f="is_active" '+checked+' onchange="updAdminItem(this)">今期使う</label>'
      +'<button class="del" onclick="removeAdminItem('+i+')">×</button>'
      +'<div class="field"><label>項目名</label><input class="inp" data-i="'+i+'" data-f="name" value="'+esc(it.name)+'" onchange="updAdminItem(this)"></div>'
      +'<div class="field"><label>重み（この項目が合計点に占める割合）</label><select class="inp" data-i="'+i+'" data-f="weight" onchange="updAdminItem(this)">'+weightOptsHtml+'</select></div>'
      +'<div class="field"><label>数字の取得元</label><select class="inp" data-i="'+i+'" data-f="data_source" onchange="updAdminItem(this)">'+srcOptsHtml+'</select></div>'
      +'<div class="field"><label>基準値（60点になる1か月あたりの数字。売上は税込。手入力・店舗全体の総売・遅刻数では使いません）</label><input class="inp" type="number" data-i="'+i+'" data-f="base_value" value="'+(it.base_value!=null?it.base_value:'')+'" onchange="updAdminItem(this)"></div>'
      +'<div class="field"><label>評価の向き（手入力の項目のみ）</label>'
      +'<select class="inp" data-i="'+i+'" data-f="calc_type" onchange="updAdminItem(this)">'
      +'<option value="ratio"'+(it.calc_type==='ratio'?' selected':'')+'>数値が多いほど高評価（売上・件数など）</option>'
      +'<option value="inverse_count"'+(it.calc_type==='inverse_count'?' selected':'')+'>数値が少ないほど高評価（遅刻・欠勤など）</option>'
      +'</select></div>'
      +'<div class="field"><label>尺度（各点数に対応する達成率％。60点＝100％がベースの目安ですが自由に変更できます）</label>'+scaleRowsHtml+'</div>'
      +'</div>';
  }).join('')||'<div class="empty-msg">項目がありません。「＋項目を追加」から作成してください</div>';
}
function updScalePct(el){
  const i=Number(el.dataset.i),score=Number(el.dataset.score),val=el.value===''?null:Number(el.value);
  const scale=(adminItems[i].scale_json||[]).filter(function(pair){return pair[1]!==score;});
  if(val!=null)scale.push([val/100,score]);
  scale.sort(function(a,b){return a[1]-b[1];});
  adminItems[i].scale_json=scale;
}

function updAdminItem(el){
  const i=Number(el.dataset.i),f=el.dataset.f;
  if(f==='weight'){
    adminItems[i][f]=Number(el.value);
  } else if(f==='base_value'){
    adminItems[i][f]=el.value===''?null:Number(el.value);
  } else if(f==='is_active'){
    adminItems[i][f]=el.checked;
  } else {
    adminItems[i][f]=el.value;
  }
}
function addAdminItem(){
  const pos=document.getElementById('admin-position').value;
  adminItems.push({position:pos,name:'新しい項目',weight:0.1,calc_type:'ratio',data_source:'manual',base_value:null,scale_json:[[0.75,10],[0.8,20],[0.85,30],[0.9,40],[0.95,50],[1.0,60],[1.1,70],[1.2,80],[1.3,90],[1.4,100]],sort_order:adminItems.length+1,is_active:true});
  renderAdminItemsHtml();
}
function removeAdminItem(i){adminItems.splice(i,1);renderAdminItemsHtml();}

async function saveAdminItems(){
  if(!canEditAdmin())return;
  const pos=document.getElementById('admin-position').value;
  for(let i=0;i<adminItems.length;i++){
    const it=adminItems[i];
    it.sort_order=i+1;
    const payload={position:pos,name:it.name,weight:it.weight,calc_type:it.calc_type,data_source:it.data_source||'manual',base_value:it.base_value!=null?it.base_value:null,scale_json:it.scale_json,sort_order:it.sort_order,is_active:it.is_active!==false};
    if(it.id){
      await sb.from('eval_criteria').update(payload).eq('id',it.id);
    } else {
      await sb.from('eval_criteria').insert(payload);
    }
  }
  closeAdminModal();
  loadListView();
}

/* ===== 起動 ===== */
(async function(){
  const loginId=localStorage.getItem('logged_in_id');
  if(!loginId){document.getElementById('locked-view').style.display='block';document.getElementById('locked-view').textContent='ログインが必要です';return;}
  const {data:sData}=await sb.from('students').select('*').order('created_at');
  students=(sData||[]).filter(function(s){return s.is_active!==false;});
  assignHistory=await loadAssignmentHistory(sb);
  ME=(sData||[]).find(function(s){return s.id===loginId;})||null;
  if(!ME){document.getElementById('locked-view').style.display='block';document.getElementById('locked-view').textContent='ログインが必要です';return;}
  document.getElementById('app-wrap').style.display='block';
  yearOptions();
  document.getElementById('ev-quarter').value=String(currentQuarterGuess());
  document.getElementById('ev-pos-filter').innerHTML='<option value="">すべての役職</option>'+POS_ORDER.map(function(p){return '<option value="'+esc(p)+'">'+esc(p)+'</option>';}).join('');
  document.getElementById('admin-row').style.display='';
  if(canEditAdmin())document.getElementById('admin-open-btn').style.display='';
  if(!canSeeAll()){
    document.querySelector('.store-tabs').style.display='none';
    document.getElementById('ev-pos-filter').style.display='none';
  }
  await loadPayroll();
  renderPayroll();
  loadListView();
})();
</script>
