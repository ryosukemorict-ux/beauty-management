<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>次回予約管理 | ailes group</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --cream:#faf6f0;--gold:#c9a96e;--gold-light:#e8d5b0;--dark:#1a1410;
  --mid:#7a6a58;--soft:#c4b49e;--accent:#8b5e3c;--green:#4a7c59;
  --red:#c0392b;--blue:#2980b9;--purple:#7d3c98;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);font-family:'Noto Sans JP',sans-serif;color:var(--dark);min-height:100vh;}

/* TOP BAR */
.top-bar{background:var(--dark);color:var(--gold-light);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;}
.top-bar-title{font-family:'Playfair Display',serif;font-size:18px;letter-spacing:1px;}
.top-bar-right{display:flex;align-items:center;gap:10px;}
.back-btn{background:rgba(255,255,255,0.1);border:1px solid var(--gold);color:var(--gold-light);padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;text-decoration:none;}
.back-btn:hover{background:var(--gold);color:var(--dark);}

/* TABS */
.tab-bar{background:#fff;border-bottom:2px solid var(--gold-light);display:flex;padding:0 20px;gap:4px;}
.tab{padding:12px 20px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--mid);}
.tab.active{border-bottom-color:var(--gold);color:var(--dark);font-weight:700;}

/* MAIN */
.main{padding:20px;max-width:1200px;margin:0 auto;}

/* PANEL */
.panel{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.panel-title{font-size:15px;font-weight:700;color:var(--dark);margin-bottom:16px;display:flex;align-items:center;gap:8px;}

/* FILTER BAR */
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;}
.filter-bar label{font-size:12px;color:var(--mid);}
.filter-sel{border:1px solid var(--gold-light);border-radius:8px;padding:6px 10px;font-size:13px;background:#fff;color:var(--dark);}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;border:none;font-family:'Noto Sans JP',sans-serif;}
.btn-dark{background:var(--dark);color:var(--gold-light);}
.btn-dark:hover{background:var(--accent);}
.btn-outline{background:#fff;border:1px solid var(--gold);color:var(--dark);}
.btn-outline:hover{background:var(--cream);}

/* TABLE */
.table-wrap{overflow-x:auto;}
table.tbl-main{width:100%;border-collapse:collapse;font-size:13px;}
table.tbl-main th{background:var(--dark);color:var(--gold-light);padding:10px 8px;text-align:center;white-space:nowrap;font-weight:500;}
table.tbl-main td{padding:8px;text-align:center;border-bottom:1px solid var(--gold-light);vertical-align:middle;}
table.tbl-main tr:hover td{background:rgba(201,169,110,0.08);}
table.tbl-main tr.subtotal td{background:rgba(201,169,110,0.15);font-weight:700;}
table.tbl-main tr.total td{background:var(--dark);color:var(--gold-light);font-weight:700;}
table.tbl-main input[type="number"]{width:60px;border:1px solid var(--gold-light);border-radius:6px;padding:4px 6px;text-align:center;font-size:13px;}
table.tbl-main input[type="number"]:focus{outline:none;border-color:var(--gold);}
.rate-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;}
.rate-high{background:#d4edda;color:#155724;}
.rate-mid{background:#fff3cd;color:#856404;}
.rate-low{background:#f8d7da;color:#721c24;}

/* RANKING */
.rank-list{display:flex;flex-direction:column;gap:10px;}
.rank-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;background:var(--cream);}
.rank-num{font-size:18px;font-weight:700;width:32px;text-align:center;}
.rank-num.gold{color:#c9a96e;}
.rank-num.silver{color:#888;}
.rank-num.bronze{color:#cd7f32;}
.rank-name{flex:1;font-size:14px;font-weight:500;}
.rank-store{font-size:11px;color:var(--mid);}
.rank-bar-wrap{width:160px;}
.rank-bar-bg{background:#e0e0e0;border-radius:4px;height:8px;overflow:hidden;}
.rank-bar-fill{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--accent));}
.rank-pct{font-size:14px;font-weight:700;color:var(--accent);min-width:48px;text-align:right;}

/* CHART */
.chart-wrap{position:relative;height:320px;}

/* MONTH NAV */
.month-nav{display:flex;align-items:center;gap:12px;}
.month-nav button{background:none;border:1px solid var(--gold-light);border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:14px;}
.month-nav button:hover{background:var(--gold-light);}
.month-label{font-size:15px;font-weight:700;min-width:100px;text-align:center;}

/* NOTICE */
.notice{background:#fff8e1;border-left:4px solid var(--gold);padding:10px 14px;border-radius:6px;font-size:12px;color:var(--mid);margin-bottom:16px;}

/* LOADING */
.loading{text-align:center;padding:40px;color:var(--mid);}

/* SECTION hidden */
.section{display:none;}
.section.active{display:block;}

/* Stats summary */
.summary{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
.stat{background:var(--cream);border-radius:10px;padding:12px 18px;flex:1;min-width:120px;}
.stat-n{font-size:22px;font-weight:700;color:var(--gold);}
.stat-l{font-size:11px;color:var(--mid);margin-top:2px;}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-bar-title">📅 次回予約管理</div>
  <div class="top-bar-right">
    <a href="index.html" class="back-btn">← ダッシュボード</a>
  </div>
</div>

<!-- TABS -->
<div class="tab-bar">
  <div class="tab active" onclick="switchTab('table')">📋 日別入力表</div>
  <div class="tab" onclick="switchTab('ranking')">🏆 ランキング</div>
  <div class="tab" onclick="switchTab('graph')">📈 成長グラフ</div>
</div>

<div class="main">

  <!-- ① 日別入力表 -->
  <div id="sec-table" class="section active">
    <div class="panel">
      <div class="panel-title">📋 日別次回予約入力表</div>
      <div class="filter-bar">
        <div class="month-nav">
          <button onclick="changeMonth(-1)">‹</button>
          <div class="month-label" id="month-label-table">2026年6月</div>
          <button onclick="changeMonth(1)">›</button>
        </div>
        <label>店舗：</label>
        <select class="filter-sel" id="store-filter-table" onchange="renderTable()">
          <option value="both">両店合計</option>
          <option value="els">エルズ</option>
          <option value="soleil">soleil by ailes</option>
        </select>
        <button class="btn btn-dark" onclick="saveAll()">💾 保存</button>
      </div>
      <div class="notice">📝 各自の来客数・次回予約数を入力してください。次回予約率は自動計算されます。</div>
      <div id="table-summary" class="summary"></div>
      <div class="table-wrap">
        <table class="tbl-main" id="main-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ② ランキング -->
  <div id="sec-ranking" class="section">
    <div class="panel">
      <div class="panel-title">🏆 月別次回予約率ランキング</div>
      <div class="filter-bar">
        <div class="month-nav">
          <button onclick="changeMonthRank(-1)">‹</button>
          <div class="month-label" id="month-label-rank">2026年6月</div>
          <button onclick="changeMonthRank(1)">›</button>
        </div>
        <label>店舗：</label>
        <select class="filter-sel" id="store-filter-rank" onchange="renderRanking()">
          <option value="both">全員</option>
          <option value="els">エルズ</option>
          <option value="soleil">soleil by ailes</option>
        </select>
      </div>
      <div id="ranking-list" class="rank-list"><div class="loading">データを読み込み中...</div></div>
    </div>
  </div>

  <!-- ③ 成長グラフ -->
  <div id="sec-graph" class="section">
    <div class="panel">
      <div class="panel-title">📈 スタッフ別 月別推移グラフ</div>
      <div class="filter-bar">
        <label>表示期間：</label>
        <select class="filter-sel" id="graph-months">
          <option value="6">直近6ヶ月</option>
          <option value="12">直近12ヶ月</option>
          <option value="3">直近3ヶ月</option>
        </select>
        <label>店舗：</label>
        <select class="filter-sel" id="store-filter-graph" onchange="renderGraph()">
          <option value="both">全員</option>
          <option value="els">エルズ</option>
          <option value="soleil">soleil by ailes</option>
        </select>
        <button class="btn btn-outline" onclick="renderGraph()">更新</button>
      </div>
      <div class="chart-wrap">
        <canvas id="growth-chart"></canvas>
      </div>
    </div>
  </div>

</div>

<script>
// ===== SUPABASE SETUP =====
const SUPABASE_URL = 'https://nrweporylfaorlqektsk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yd2Vwb3J5bGZhb3JscWVrdHNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0ODUzMDAsImV4cCI6MjA5NDA2MTMwMH0.48m8FDoD3oFaqxXEZ625wr5zD001c1ghuUOmcaNaICQ';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ===== STATE =====
let currentYear = 2026;
let currentMonth = 6;
let rankYear = 2026;
let rankMonth = 6;
let allStaff = [];
let allReservations = [];
let growthChart = null;

// ===== INIT =====
async function init() {
  const { data, error } = await sb.from('students').select('id,name,store,position,is_active').eq('is_active', true).order('store').order('name');
  if (!error && data) allStaff = data;
  await loadReservations();
  renderTable();
}

async function loadReservations() {
  const startDate = `${currentYear}-${String(currentMonth).padStart(2,'0')}-01`;
  const endDate = new Date(currentYear, currentMonth, 0).toISOString().split('T')[0];
  const { data, error } = await sb.from('next_reservations').select('*').gte('date', startDate).lte('date', endDate);
  if (!error && data) allReservations = data;
}

// ===== TAB SWITCH =====
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.remove('active');
    if(['table','ranking','graph'][i] === tab) t.classList.add('active');
  });
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-'+tab).classList.add('active');
  if(tab === 'ranking') renderRanking();
  if(tab === 'graph') renderGraph();
}

// ===== MONTH NAV =====
function changeMonth(d) {
  currentMonth += d;
  if(currentMonth > 12){currentMonth=1;currentYear++;}
  if(currentMonth < 1){currentMonth=12;currentYear--;}
  document.getElementById('month-label-table').textContent = `${currentYear}年${currentMonth}月`;
  loadReservations().then(() => renderTable());
}
function changeMonthRank(d) {
  rankMonth += d;
  if(rankMonth > 12){rankMonth=1;rankYear++;}
  if(rankMonth < 1){rankMonth=12;rankYear--;}
  document.getElementById('month-label-rank').textContent = `${rankYear}年${rankMonth}月`;
  renderRanking();
}

// ===== RENDER TABLE =====
function renderTable() {
  const storeFilter = document.getElementById('store-filter-table').value;
  const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();

  // 対象スタッフ
  let staff = allStaff.filter(s => {
    if(storeFilter === 'els') return s.store === 'els' || s.store === 'エルズ';
    if(storeFilter === 'soleil') return s.store === 'soleil' || s.store === 'soleil by ailes';
    return true;
  });

  // HEAD
  const head = document.getElementById('table-head');
  head.innerHTML = `<tr>
    <th style="min-width:80px">日付</th>
    ${staff.map(s => `<th style="min-width:130px">${s.name}<br><span style="font-size:10px;opacity:0.7">${s.store||''}</span></th>`).join('')}
    ${storeFilter==='both'?'<th style="min-width:80px">合計<br>来客</th><th style="min-width:80px">合計<br>予約</th><th style="min-width:80px">合計<br>予約率</th>':''}
  </tr>
  <tr style="background:rgba(201,169,110,0.2)">
    <th style="font-size:11px;padding:4px"></th>
    ${staff.map(() => `<th colspan="1" style="font-size:10px;padding:4px;font-weight:400">来客 / 予約 / 率</th>`).join('')}
    ${storeFilter==='both'?'<th></th><th></th><th></th>':''}
  </tr>`;

  // BODY
  const body = document.getElementById('table-body');
  body.innerHTML = '';

  let monthTotalVisitor = 0, monthTotalReserv = 0;

  for(let d=1; d<=daysInMonth; d++) {
    const dateStr = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayOfWeek = ['日','月','火','水','木','金','土'][new Date(dateStr).getDay()];
    const isWeekend = new Date(dateStr).getDay() === 0 || new Date(dateStr).getDay() === 6;

    let rowVisitor = 0, rowReserv = 0;
    const cells = staff.map(s => {
      const rec = allReservations.find(r => r.staff_id === s.id && r.date === dateStr);
      const v = rec ? rec.visitor_count : 0;
      const n = rec ? rec.next_reservation_count : 0;
      const rate = v > 0 ? Math.round(n/v*100) : 0;
      rowVisitor += v; rowReserv += n;
      const rateClass = rate >= 70 ? 'rate-high' : rate >= 50 ? 'rate-mid' : (v>0?'rate-low':'');
      return `<td>
        <select data-staff="${s.id}" data-date="${dateStr}" data-type="visitor" onchange="recalcRate(this)" style="width:44px;border:1px solid #e8d5b0;border-radius:6px;padding:2px;font-size:12px">${[...Array(31)].map((_,i)=>`<option value="${i}" ${v==i?'selected':''}>${i}</option>`).join('')}</select>
<select data-staff="${s.id}" data-date="${dateStr}" data-type="next_res" onchange="recalcRate(this)" style="width:44px;border:1px solid #e8d5b0;border-radius:6px;padding:2px;font-size:12px">${[...Array(31)].map((_,i)=>`<option value="${i}" ${n==i?'selected':''}>${i}</option>`).join('')}</select>
        <span class="rate-badge ${rateClass}" id="rate-${s.id}-${dateStr}">${v>0?rate+'%':'-'}</span>
      </td>`;
    }).join('');

    monthTotalVisitor += rowVisitor;
    monthTotalReserv += rowReserv;
    const rowRate = rowVisitor > 0 ? Math.round(rowReserv/rowVisitor*100) : 0;
    const rowRateClass = rowRate >= 70 ? 'rate-high' : rowRate >= 50 ? 'rate-mid' : (rowVisitor>0?'rate-low':'');

    const tr = document.createElement('tr');
    if(isWeekend) tr.style.background = 'rgba(200,200,200,0.1)';
    tr.innerHTML = `
      <td style="font-weight:500">${currentMonth}/${d}(${dayOfWeek})</td>
      ${cells}
      ${storeFilter==='both'?`<td>${rowVisitor||'-'}</td><td>${rowReserv||'-'}</td><td><span class="rate-badge ${rowRateClass}">${rowVisitor>0?rowRate+'%':'-'}</span></td>`:''}
    `;
    body.appendChild(tr);

    // 10日ごと小計
    if(d % 10 === 0 || d === daysInMonth) {
      const subTr = document.createElement('tr');
      subTr.className = 'subtotal';
      const label = d === daysInMonth ? '月末合計' : `〜${d}日 小計`;
      subTr.innerHTML = `<td>${label}</td>${staff.map(() => `<td>-</td>`).join('')}${storeFilter==='both'?'<td></td><td></td><td></td>':''}`;
      body.appendChild(subTr);
    }
  }

  // サマリー
  const monthRate = monthTotalVisitor > 0 ? Math.round(monthTotalReserv/monthTotalVisitor*100) : 0;
  document.getElementById('table-summary').innerHTML = `
    <div class="stat"><div class="stat-n">${monthTotalVisitor}</div><div class="stat-l">月間来客数</div></div>
    <div class="stat"><div class="stat-n">${monthTotalReserv}</div><div class="stat-l">月間次回予約数</div></div>
    <div class="stat"><div class="stat-n" style="color:${monthRate>=70?'var(--green)':monthRate>=50?'#856404':'var(--red)'}">${monthRate}%</div><div class="stat-l">月間次回予約率</div></div>
  `;
}

// ===== RECALC RATE =====
function recalcRate(input) {
  const staffId = input.dataset.staff;
  const date = input.dataset.date;
  const row = input.closest('tr');
  const vInput = row.querySelector(`select[data-staff="${staffId}"][data-date="${date}"][data-type="visitor"]`);
  const nInput = row.querySelector(`select[data-staff="${staffId}"][data-date="${date}"][data-type="next_res"]`);
  const v = parseInt(vInput?.value) || 0;
  const n = parseInt(nInput?.value) || 0;
  const rate = v > 0 ? Math.round(n/v*100) : 0;
  const badge = document.getElementById(`rate-${staffId}-${date}`);
  if(badge) {
    badge.textContent = v > 0 ? rate+'%' : '-';
    badge.className = 'rate-badge ' + (rate>=70?'rate-high':rate>=50?'rate-mid':(v>0?'rate-low':''));
  }
  updateTotals();
}

function updateTotals() {
  const rows = document.querySelectorAll('#table-body tr:not(.subtotal):not(.total)');
  let monthV = 0, monthN = 0;
  rows.forEach(row => {
    row.querySelectorAll('select[data-type="visitor"]').forEach(s => monthV += parseInt(s.value)||0);
    row.querySelectorAll('select[data-type="next_res"]').forEach(s => monthN += parseInt(s.value)||0);
  });
  const monthRate = monthV > 0 ? Math.round(monthN/monthV*100) : 0;
  document.getElementById('table-summary').innerHTML = `
    <div class="stat"><div class="stat-n">${monthV}</div><div class="stat-l">月間来客数</div></div>
    <div class="stat"><div class="stat-n">${monthN}</div><div class="stat-l">月間次回予約数</div></div>
    <div class="stat"><div class="stat-n" style="color:${monthRate>=70?'var(--green)':monthRate>=50?'#856404':'var(--red)'}">${monthRate}%</div><div class="stat-l">月間次回予約率</div></div>
  `;
}

// ===== SAVE =====
async function saveAll() {
  const inputs = document.querySelectorAll('#table-body select');
  const dataMap = {};
  inputs.forEach(inp => {
    const key = `${inp.dataset.staff}_${inp.dataset.date}`;
    if(!dataMap[key]) dataMap[key] = {staff_id:inp.dataset.staff, date:inp.dataset.date, visitor_count:0, next_reservation_count:0};
    if(inp.dataset.type === 'visitor') dataMap[key].visitor_count = parseInt(inp.value)||0;
    if(inp.dataset.type === 'next_res') dataMap[key].next_reservation_count = parseInt(inp.value)||0;
  });

  const upsertData = Object.values(dataMap).filter(d => d.visitor_count > 0 || d.next_reservation_count > 0);
  if(upsertData.length === 0) { alert('入力データがありません'); return; }

  const { error } = await sb.from('next_reservations').upsert(upsertData, {onConflict:'staff_id,date'});
  if(error) { alert('保存エラー: '+error.message); return; }
  alert('✅ 保存しました！');
  await loadReservations();
}

// ===== RANKING =====
async function renderRanking() {
  const storeFilter = document.getElementById('store-filter-rank').value;
  const startDate = `${rankYear}-${String(rankMonth).padStart(2,'0')}-01`;
  const endDate = new Date(rankYear, rankMonth, 0).toISOString().split('T')[0];

  const { data, error } = await sb.from('next_reservations').select('staff_id,visitor_count,next_reservation_count').gte('date',startDate).lte('date',endDate);

  const list = document.getElementById('ranking-list');
  if(error || !data) { list.innerHTML = '<div class="loading">データ取得エラー</div>'; return; }

  let staff = allStaff.filter(s => {
    if(storeFilter === 'els') return s.store === 'els' || s.store === 'エルズ';
    if(storeFilter === 'soleil') return s.store === 'soleil' || s.store === 'soleil by ailes';
    return true;
  });

  const staffStats = staff.map(s => {
    const recs = data.filter(r => r.staff_id === s.id);
    const totalV = recs.reduce((a,r) => a+r.visitor_count,0);
    const totalN = recs.reduce((a,r) => a+r.next_reservation_count,0);
    const rate = totalV > 0 ? Math.round(totalN/totalV*100) : 0;
    return {...s, totalV, totalN, rate};
  }).filter(s => s.totalV > 0).sort((a,b) => b.rate - a.rate);

  if(staffStats.length === 0) { list.innerHTML = '<div class="loading">この月のデータがありません</div>'; return; }

  const maxRate = staffStats[0].rate;
  list.innerHTML = staffStats.map((s,i) => {
    const numClass = i===0?'gold':i===1?'silver':i===2?'bronze':'';
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    const rateClass = s.rate>=70?'rate-high':s.rate>=50?'rate-mid':'rate-low';
    return `<div class="rank-item">
      <div class="rank-num ${numClass}">${medal||i+1}</div>
      <div style="flex:1">
        <div class="rank-name">${s.name}</div>
        <div class="rank-store">${s.store||''} / 来客${s.totalV}名 予約${s.totalN}名</div>
      </div>
      <div class="rank-bar-wrap">
        <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${maxRate>0?Math.round(s.rate/maxRate*100):0}%"></div></div>
      </div>
      <div class="rank-pct"><span class="rate-badge ${rateClass}">${s.rate}%</span></div>
    </div>`;
  }).join('');
}

// ===== GRAPH =====
async function renderGraph() {
  const months = parseInt(document.getElementById('graph-months').value);
  const storeFilter = document.getElementById('store-filter-graph').value;

  // 期間計算
  const labels = [];
  const monthList = [];
  for(let i=months-1; i>=0; i--) {
    const d = new Date(2026, 5-i, 1); // ← 現在月から
    const y = d.getFullYear(), m = d.getMonth()+1;
    labels.push(`${y}/${String(m).padStart(2,'0')}`);
    monthList.push({y,m});
  }

  // データ取得
  const startDate = `${monthList[0].y}-${String(monthList[0].m).padStart(2,'0')}-01`;
  const lastM = monthList[monthList.length-1];
  const endDate = new Date(lastM.y, lastM.m, 0).toISOString().split('T')[0];
  const { data } = await sb.from('next_reservations').select('staff_id,date,visitor_count,next_reservation_count').gte('date',startDate).lte('date',endDate);

  let staff = allStaff.filter(s => {
    if(storeFilter === 'els') return s.store === 'els' || s.store === 'エルズ';
    if(storeFilter === 'soleil') return s.store === 'soleil' || s.store === 'soleil by ailes';
    return true;
  });

  const colors = ['#c9a96e','#4a7c59','#2980b9','#7d3c98','#c0392b','#e67e22','#1abc9c','#e74c3c','#3498db','#9b59b6'];

  const datasets = staff.map((s,idx) => {
    const rateData = monthList.map(({y,m}) => {
      const prefix = `${y}-${String(m).padStart(2,'0')}`;
      const recs = (data||[]).filter(r => r.staff_id === s.id && r.date.startsWith(prefix));
      const totalV = recs.reduce((a,r)=>a+r.visitor_count,0);
      const totalN = recs.reduce((a,r)=>a+r.next_reservation_count,0);
      return totalV > 0 ? Math.round(totalN/totalV*100) : null;
    });
    return {
      label: s.name,
      data: rateData,
      borderColor: colors[idx%colors.length],
      backgroundColor: colors[idx%colors.length]+'22',
      tension: 0.4,
      spanGaps: true,
      pointRadius: 5,
      pointHoverRadius: 7,
    };
  });

  if(growthChart) growthChart.destroy();
  const ctx = document.getElementById('growth-chart').getContext('2d');
  growthChart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { font: { family: 'Noto Sans JP', size: 11 } } },
        tooltip: {
          callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y != null ? ctx.parsed.y+'%' : 'データなし'}` }
        }
      },
      scales: {
        y: {
          min: 0, max: 100,
          ticks: { callback: v => v+'%', font: { size: 11 } },
          title: { display: true, text: '次回予約率 (%)', font: { size: 11 } }
        },
        x: { ticks: { font: { size: 11 } } }
      }
    }
  });
}

// ===== START =====
init();
</script>
</body>
</html>
